name: Deploy to Azure VM

# The VM deploys itself: every 5 minutes, deploy/vm/deploy.sh pulls main once CI has passed for
# that commit, rebuilds, health-checks and rolls back on failure. GitHub never connects to the VM,
# so SSH stays locked to the owner's IP.
#
# This workflow verifies the rollout. It waits until the live site reports the new commit through
# /api/health, and fails if that doesn't happen in time. A green run here means "live in production".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true  # a newer merge supersedes an older rollout

jobs:
  verify-rollout:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.LIVE_URL || 'http://4.196.164.233' }}
    env:
      LIVE_URL: ${{ vars.LIVE_URL || 'http://4.196.164.233' }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for the VM to deploy this commit
        run: |
          want="${COMMIT:0:7}"
          echo "Waiting for $LIVE_URL to serve commit $want (the VM checks for new releases every 5 minutes)"
          deadline=$((SECONDS + 20 * 60))
          while ((SECONDS < deadline)); do
            health="$(curl -fsS --max-time 10 "$LIVE_URL/api/health" || echo '{}')"
            version="$(jq -r '.version // "unknown"' <<<"$health")"
            status="$(jq -r '.status // "unreachable"' <<<"$health")"
            if [[ "$version" == "$want" && "$status" == "ok" ]]; then
              echo "::notice::Live site is serving $want and reports healthy"
              exit 0
            fi
            echo "$(date -u +%H:%M:%S) live version=$version status=$status"
            sleep 30
          done
          echo "::error::The live site did not report commit $want within 20 minutes. Check the VM: journalctl -u urbanpulse-deploy -n 50"
          exit 1

      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          # Retry briefly, so a container that is still settling doesn't fail the check.
          get() { curl -fsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 "$LIVE_URL$1"; }
          areas="$(get '/api/suburbs?limit=1000' | jq length)"
          echo "areas served: $areas"
          [[ "$areas" =~ ^[0-9]+$ && "$areas" -gt 300 ]] || { echo "::error::expected over 300 areas, got '$areas'"; exit 1; }
          get /api/provenance | jq -e '.output.rows > 300' >/dev/null || { echo "::error::provenance check failed"; exit 1; }
          get / | grep -q "Based on ABS data" || { echo "::error::dashboard attribution missing"; exit 1; }
          echo "::notice::Smoke tests passed"
