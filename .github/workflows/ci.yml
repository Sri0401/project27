name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Python) - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  pipeline:
    name: Data pipeline (Python) - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q  # unit tests only; they never call the live government APIs

  ingestor:
    name: Ingestor (Java) - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  terraform:
    name: Infrastructure (Terraform) - fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  e2e:
    name: End-to-end (Docker Compose)
    needs: [api, pipeline, ingestor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "MONGO_PASSWORD=$(openssl rand -hex 16)"
            echo "API_KEY=ci-key"
            echo "WEB_PORT=8080"
          } > .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API to report healthy through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 3
          done
          echo "Stack did not become healthy" >&2
          exit 1
      - name: Smoke-test the endpoints
        run: |
          set -euo pipefail
          expected=$(( $(wc -l < data/melbourne_sa2_2021.csv) - 1 ))
          test "$(curl -fsS 'http://localhost:8080/api/suburbs?limit=1000' | jq length)" -eq "$expected"
          test "$(curl -fsS http://localhost:8080/api/ingestion/latest | jq .rows_loaded)" -eq "$expected"
          test "$(curl -fsS http://localhost:8080/api/ingestion/latest | jq .rows_rejected)" -eq 0
          curl -fsS 'http://localhost:8080/api/suburbs?q=fitzroy' | jq -e 'map(.name) | index("Fitzroy") != null'
          curl -fsS http://localhost:8080/api/suburbs/geojson | jq -e '.type == "FeatureCollection" and (.license | contains("creativecommons.org/licenses/by/4.0"))'
          curl -fsS http://localhost:8080/api/about | jq -e '.attribution | contains("Australian Bureau of Statistics") and contains("Department of Transport and Planning")'
          curl -fsS http://localhost:8080/ | grep -q 'creativecommons.org/licenses/by/4.0'
          # MongoDB: provenance stored from the manifest, idempotent across restarts, and aggregation working.
          test "$(curl -fsS http://localhost:8080/api/provenance | jq .output.rows)" -eq "$expected"
          test "$(curl -fsS http://localhost:8080/api/provenance | jq -r .output.sha256)" = "$(sha256sum data/melbourne_sa2_2021.csv | cut -d' ' -f1)"
          docker compose restart api
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health >/dev/null && break; sleep 2; done
          test "$(curl -fsS http://localhost:8080/api/provenance/history | jq length)" -eq 1
          curl -fsS http://localhost:8080/api/datasets/tags | jq -e '.[0].count >= .[-1].count and (map(.tag) | index("vic") != null)'
          curl -fsS http://localhost:8080/ | grep -q "UrbanPulse"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/datasets \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-key' \
            -d '{"slug":"ci-dataset","title":"CI dataset","publisher":"CI","licence":"CC0","url":"https://example.org"}')
          test "$code" -eq 201
          test "$(curl -fsS 'http://localhost:8080/api/datasets?tag=census' | jq length)" -eq 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
