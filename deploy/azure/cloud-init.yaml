#cloud-config
# Runs once when the VM is first created. It installs Docker, clones the repo and starts the stack.
# To deploy a different repo, change the git clone URL below (provision.sh does this for you).
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - openssl
  - jq

# A B1s VM has 1 GB of RAM. Swap stops the Maven build and MongoDB from running out of memory.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker azureuser
  - git clone https://github.com/Sri0401/project27.git /home/azureuser/urbanpulse
  - >-
    cd /home/azureuser/urbanpulse &&
    printf 'POSTGRES_PASSWORD=%s\nMONGO_PASSWORD=%s\nAPI_KEY=%s\nWEB_PORT=80\n'
    "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env &&
    chmod 600 .env
  - chown -R azureuser:azureuser /home/azureuser/urbanpulse
  - cd /home/azureuser/urbanpulse && docker compose up -d --build
  # Pull-based continuous deployment: from now on the VM updates itself from main (deploy/vm/).
  - bash /home/azureuser/urbanpulse/deploy/vm/install.sh
