name: Deploy to Azure VM

# Runs after CI passes on main, or by hand from the Actions tab.
# Needs these repository secrets: AZURE_VM_HOST, AZURE_VM_USER, AZURE_VM_SSH_KEY (see deploy/azure/README.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check deployment secrets are configured
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::AZURE_VM_HOST is not set, so deployment is skipped."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - name: Pull and restart on the VM
        if: env.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            cd ~/urbanpulse
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
            sleep 10
            curl -fsS http://localhost/api/health
