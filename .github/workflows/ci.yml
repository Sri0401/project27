name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Python) - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  ingestor:
    name: Ingestor (Java) - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  e2e:
    name: End-to-end (Docker Compose)
    needs: [api, ingestor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throwaway secrets
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "MONGO_PASSWORD=$(openssl rand -hex 16)"
            echo "API_KEY=ci-key"
            echo "WEB_PORT=8080"
          } > .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the API to report healthy through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 3
          done
          echo "Stack did not become healthy" >&2
          exit 1
      - name: Smoke-test the endpoints
        run: |
          set -euo pipefail
          test "$(curl -fsS http://localhost:8080/api/suburbs | jq length)" -eq 20
          test "$(curl -fsS http://localhost:8080/api/ingestion/latest | jq .rows_loaded)" -eq 20
          curl -fsS http://localhost:8080/api/suburbs/geojson | jq -e '.type == "FeatureCollection"'
          curl -fsS http://localhost:8080/ | grep -q "UrbanPulse"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/datasets \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-key' \
            -d '{"slug":"ci-dataset","title":"CI dataset","publisher":"CI","licence":"CC0","url":"https://example.org"}')
          test "$code" -eq 201
          test "$(curl -fsS 'http://localhost:8080/api/datasets?tag=census' | jq length)" -eq 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
