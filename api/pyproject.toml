[project]
name = "urbanpulse-api"
version = "1.0.0"
description = "REST API for suburb liveability indicators"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI uses Depends()/Query() in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
